# Release: al empujar un tag v*, arma el instalador de Windows en un runner
# windows-latest DE VERDAD (ci.yml corre la matriz typecheck+test+build ahí
# también, pero nunca empaqueta) y lo adjunta a la GitHub Release de ese tag,
# creándola si todavía no existe.
#
# Por qué acá SÍ hace falta `npm ci` completo (sin --ignore-scripts):
# ci.yml se salta los postinstall porque typecheck/test/build nunca levantan
# Electron (esbuild trae su binario por optionalDependencies, sin postinstall;
# electron-vite tampoco necesita el binario de Electron para bundlear). Pero
# este job corre `electron-builder --win --x64`, que empaqueta la app CON el
# runtime de Electron — y para eso hace falta el binario ya descargado del
# postinstall del paquete `electron` en node_modules/electron/dist.
# electron-builder también sabe descargarlo por su cuenta desde su propia
# caché (@electron/get) aunque node_modules/electron esté vacío, pero apoyarse
# en esa ruta paralela en el único job que produce el artefacto que se publica
# es un riesgo innecesario: acá se corre `npm ci` a secas.
#
# Firma de editor: el paso de abajo ya pasa CSC_LINK/CSC_KEY_PASSWORD como env
# vars desde secrets del repo, pero HOY esos secrets no existen — no hay
# certificado de firma de código comprado. Cuando el secret no existe, GitHub
# Actions lo resuelve como cadena vacía, y electron-builder trata
# CSC_LINK === "" igual que "no seteado": omite la firma sin fallar el build
# (confirmado leyendo node_modules/app-builder-lib/out/codeSign/
# windowsSignToolManager.js: `if (cscLink == null || cscLink === "") return null`).
# O sea: el instalador sale sin firmar hasta que alguien cargue esos dos
# secrets, y ese día sale firmado sin tocar una línea de este archivo. El
# README ya avisa que SmartScreen muestra la advertencia de editor no
# reconocido la primera vez ("Más información → Ejecutar de todas formas").
# Qué certificado comprar, dónde, y el nombre exacto de cada secret:
# docs/FIRMA.md — no repetido acá para no tener dos fuentes que puedan
# desalinearse.
#
# Por qué esto NO se niega a publicar si `CI` está roja para el mismo commit
# (la v3.8.0 lo hizo: `Release` en verde con `CI` en rojo, y nadie se enteró
# — ver la tarjeta «el rojo que nadie miró»):
#   - Se decidió A CONCIENCIA no bloquear. La alternativa —que este workflow
#     espere o dependa (`needs:`) del resultado de `CI` para el SHA taggeado—
#     convierte un tag en un comando que puede colgarse: si alguien taggea
#     ANTES de que `CI` para ese commit siquiera arranque (nada lo impide;
#     son dos triggers independientes, `push: tags` acá y `push: branches:
#     [main]` en ci.yml), esperar un resultado que no existe todavía es
#     esperar indefinidamente o inventar un timeout arbitrario — y eso sí es
#     la puerta que hay que saltarse con prisas el día de un hotfix real.
#   - Lo que la tarjeta pide de verdad es que el rojo SE VEA, no que bloquee.
#     Así que el paso de abajo consulta el estado de `CI` para
#     `github.sha` (con `tools/qa/ci-status.ts`, el mismo comando que
#     `npm run ci:status` — una sola lógica de qué cuenta como verde/rojo) y
#     lo escribe en tres sitios que nadie tiene que ir a buscar: el resumen
#     del job (`GITHUB_STEP_SUMMARY`), un `::warning::` si no está verde (así
#     se ve en la lista de runs sin abrir ninguno), y una línea al principio
#     del cuerpo de la GitHub Release — que es precisamente donde se leyó la
#     v3.8.0 sin saber que su CI había fallado.
#   - Consultar en vez de esperar también evita la otra trampa: la CI de hoy
#     tarda ~4 minutos (medido en los runs de `ci.yml`), así que un `needs:`
#     alargaría CADA release en ese tiempo aunque siempre saliera verde. Un
#     hotfix real gana más publicando ya, con el rojo (si lo hay) imposible
#     de no ver, que esperando cuatro minutos con la app instalable ya rota
#     en el ambiente del usuario.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Sin --ignore-scripts: ver el comentario de arriba del archivo.
      - run: npm ci

      - name: Consultar el estado de CI para este commit (no bloquea — se anuncia)
        id: ci_status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          linea="$(npm run --silent ci:status -- "$GITHUB_SHA")"
          codigo=$?
          set -e
          echo "$linea"
          {
            echo "### Estado de CI para ${GITHUB_SHA:0:7}"
            echo "$linea"
          } >> "$GITHUB_STEP_SUMMARY"
          # Ver el porqué de no fallar el job en el comentario de arriba del
          # archivo: 1 = CI roja, 2 = sin ejecución encontrada, 3 = en curso.
          # Ninguno de los tres detiene la publicación; los tres se anuncian.
          if [ "$codigo" != "0" ]; then
            echo "::warning::CI para este commit NO está verde (código $codigo) — $linea"
          fi
          # Reescapado de un solo renglón para que el `echo` a GITHUB_OUTPUT
          # de más abajo no se rompa si la línea trajera un '%' o un salto.
          linea_segura="${linea//'%'/'%25'}"
          linea_segura="${linea_segura//$'\n'/' '}"
          echo "linea=$linea_segura" >> "$GITHUB_OUTPUT"

      - name: Compilar + empaquetar (electron-vite build && electron-builder --win --x64)
        env:
          # Vacíos hoy (no hay certificado). Ver el comentario de arriba del
          # archivo y docs/FIRMA.md — cargar estos dos secrets alcanza para
          # que este mismo step empiece a firmar, sin más cambios acá.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist -w @orbit/desktop

      - name: Smoke test del paquete (pack de sonidos en resources/sound-library)
        run: node tools/qa/package-smoke.mjs apps/desktop/dist/win-unpacked

      - name: Resumen del instalador (nombre + tamaño)
        run: |
          node -e "
            const fs = require('node:fs');
            const dir = 'apps/desktop/dist';
            const exe = fs.readdirSync(dir).find((f) => f.toLowerCase().endsWith('.exe'));
            if (!exe) { console.error('No hay .exe en ' + dir); process.exit(1); }
            const bytes = fs.statSync(dir + '/' + exe).size;
            const mb = (bytes / (1024 * 1024)).toFixed(1);
            const line = 'Instalador: ' + exe + ' — ' + mb + ' MB';
            console.log(line);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '**' + line + '**\n');
            }
          "

      - name: Publicar/actualizar la GitHub Release y adjuntar el instalador
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_STATUS_LINE: ${{ steps.ci_status.outputs.linea }}
        run: |
          set -euo pipefail
          notas_ci="Estado de \`CI\` para este commit al momento de publicar: ${CI_STATUS_LINE:-sin dato}."
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" apps/desktop/dist/*.exe --clobber
          else
            gh release create "${{ github.ref_name }}" apps/desktop/dist/*.exe \
              --title "${{ github.ref_name }}" \
              --notes "$notas_ci" \
              --generate-notes
          fi
