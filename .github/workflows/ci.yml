# CI mínimo: cada push/PR debe compilar tipos, pasar los tests y construir la app.
# --ignore-scripts: ni electron ni esbuild necesitan postinstall aquí (esbuild trae
# el binario por optionalDependencies; el binario de electron solo hace falta para
# ejecutar la app, no para bundlear con electron-vite).
#
# Matriz ubuntu-latest + windows-latest: la app es Windows-only de verdad
# (acrílico por DWM, backgroundMaterial, NSIS) y hay lógica sensible a la
# plataforma (p. ej. apps/desktop/src/main/path-guard.ts, que normaliza rutas
# distinto según process.platform === 'win32' y tiene su propio test en
# apps/desktop/test/path-guard.test.ts). Corriendo solo en Linux, un fallo de
# ese tipo no lo ve nadie hasta abrir la app empaquetada. El empaquetado en sí
# (electron-builder --win) NO corre acá — para eso está el workflow de
# release.yml, que arma y prueba el instalador de verdad al taguear.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
